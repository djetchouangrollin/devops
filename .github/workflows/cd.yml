# .github/workflows/cd-promote-dev.yml
name: CD – Deploy

on:
  workflow_run:
    workflows: ["CI – Build and Test"]
    branches: [feature, dev]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v3

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          set +e
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} '
            cd /path/to/project &&
            git pull origin feature &&
            docker-compose down &&
            docker-compose build &&
            docker-compose up -d
          ' > deploy.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

  create-issue:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v3

      - name: Create Issue on Failure
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const commit = context.sha;
            
            let body = `## CD Failure on ${branch}\n\n`;
            body += `Commit: ${commit}\n\n`;
            
            // Deployment results
            if (${{ needs.deploy.result }} === 'failure') {
              body += `### Deployment Failed\n`;
              body += `\`\`\`\n${fs.readFileSync('deploy.log', 'utf8')}\n\`\`\`\n\n`;
            }
            
            await github.rest.issues.create({
              owner,
              repo,
              title: `CD Failure on ${branch}`,
              body,
              labels: ['cd-failure', 'bug']
            });