# .github/workflows/ci-docker-build.yml
name: CI – Build and Test

# Utilise pull_request_target pour pouvoir créer des issues avec GITHUB_TOKEN
on:
  push:
    branches: [ feature, dev ]
  pull_request:
    branches: [ feature, dev ]

# Assure-toi que le token a bien le droit de créer des issues
permissions:
  contents: read
  issues: write

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: frontend-tests
        continue-on-error: true
        run: npm test -- --watchAll=false

      - name: Build
        id: frontend-build
        continue-on-error: true
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: './server/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        id: backend-tests
        continue-on-error: true
        run: python manage.py test

  docker-build:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build client Docker image
        id: client_build
        continue-on-error: true
        run: |
          set +e
          docker build -f client/Dockerfile -t client-check client/ > client_build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Build server Docker image
        id: server_build
        continue-on-error: true
        run: |
          set +e
          docker build -f server/Dockerfile -t server-check server/ > server_build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

  create-issue:
    needs: [test-frontend, test-backend, docker-build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v3

      - name: Create Issue on Failure
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const commit = context.sha;
            
            let body = `## CI Failure on ${branch}\n\n`;
            body += `Commit: ${commit}\n\n`;
            
            // Frontend test results
            if (${{ needs.test-frontend.result }} === 'failure') {
              body += `### Frontend Tests Failed\n`;
              body += `\`\`\`\n${fs.readFileSync('client_build.log', 'utf8')}\n\`\`\`\n\n`;
            }
            
            // Backend test results
            if (${{ needs.test-backend.result }} === 'failure') {
              body += `### Backend Tests Failed\n`;
              body += `\`\`\`\n${fs.readFileSync('server_build.log', 'utf8')}\n\`\`\`\n\n`;
            }
            
            // Docker build results
            if (${{ needs.docker-build.result }} === 'failure') {
              body += `### Docker Build Failed\n`;
              body += `\`\`\`\n${fs.readFileSync('client_build.log', 'utf8')}\n\`\`\`\n\n`;
              body += `\`\`\`\n${fs.readFileSync('server_build.log', 'utf8')}\n\`\`\`\n\n`;
            }
            
            await github.rest.issues.create({
              owner,
              repo,
              title: `CI Failure on ${branch}`,
              body,
              labels: ['ci-failure', 'bug']
            });